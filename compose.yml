version: "3.9"

services:
  devopsdb:
    image: poornaavula1211/myfp:db
    ports:
      - "3306:3306"
    deploy:
      mode: replicated
      replicas: 1  # ← CHANGE: Only ONE database instance
      placement:
        constraints:
          - node.role == manager  # Keep DB on manager node
      resources:
        limits:
          cpus: "0.5"
          memory: 350M
        reservations:
          cpus: "0.25"
          memory: 64M
    volumes:
      - mydbvolume:/var/lib/mysql/
    
  application:
    image: poornaavula1211/myfp:app
    ports:
      - "1111:8080"
    deploy:
      mode: replicated
      replicas: 3
      resources:
        limits:
          cpus: "0.5"
          memory: 350M
        reservations:
          cpus: "0.25"
          memory: 64M
    depends_on:
      - devopsdb

volumes:
  mydbvolume:
    driver: local
