version: "3.9"

services:

  devopsdb:
    image: poornaavula1211/myfp:db

    ports:
      - "3306:3306"

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

    volumes:
      - mydbvolume:/var/lib/mysql

  application:
    image: poornaavula1211/myfp:app

    ports:
      - "1111:8080"

    deploy:
      replicas: 3

    depends_on:
      - devopsdb

volumes:
  mydbvolume:
